# Publishes the game as a static site on GitHub Pages. The game is plain files (no build), so the site is a copy of
# index.html, style.css and src/. On the free plan, GitHub Pages works only for a public repository, so the job is skipped
# while the repository is private (no failed run on every push) and starts to publish on every push to main once it is
# public and Pages is set to "GitHub Actions" in the settings (Settings, Pages, Source). See "Publishing" in AGENTS.md.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Run the tests first (a broken rule must not be published)
        run: node --test
      - name: Collect the site
        run: |
          mkdir site
          cp index.html style.css site/
          cp -r src site/src
      - name: Stamp the build (the commit and the time) over src/version.js of the site
        run: |
          printf 'const BUILD = { commit: "%s", date: "%s" };\n' "${GITHUB_SHA::7}" "$(TZ=America/Sao_Paulo date +'%Y-%m-%d %H:%M GMT-3')" > site/src/version.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
