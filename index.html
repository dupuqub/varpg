<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>varpg</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Entry screen -->
  <main id="screen-menu" class="screen">
    <h1>VARPG</h1>
    <button disabled>NEW GAME</button>
    <button disabled>CONTINUE</button>
    <button data-goto="screen-chambers">TEST CHAMBERS</button>
  </main>

  <!-- Choose the test map -->
  <main id="screen-chambers" class="screen" hidden>
    <h1>TEST CHAMBERS</h1>
    <button data-goto="screen-chamber-1">CHAMBER 1: MOVEMENT</button>
    <button data-goto="screen-chamber-2">CHAMBER 2: DIAGNOSTICS</button>
    <button data-goto="screen-menu">BACK</button>
  </main>

  <!-- Chamber 1: only for testing movement -->
  <main id="screen-chamber-1" class="screen fullscreen" hidden>
    <canvas id="canvas" width="1920" height="1080"></canvas>
    <div class="overlay">
      <span>CHAMBER 1: MOVEMENT</span>
      <span class="hint">WASD / LEFT STICK: MOVE · SPACE / A: DASH</span>
      <button data-goto="screen-chambers">BACK (ESC)</button>
    </div>
  </main>

  <!-- Chamber 2: not a place in the game. Buttons that print text to copy. -->
  <main id="screen-chamber-2" class="screen" hidden>
    <h1>CHAMBER 2: DIAGNOSTICS</h1>
    <p class="hint">PRESS A BUTTON, THEN COPY THE OUTPUT</p>
    <div class="tools">
      <button id="tool-environment">ENVIRONMENT</button>
      <button id="tool-simulation">SIMULATION CHECK</button>
      <button id="tool-data">DATA</button>
    </div>
    <textarea id="output" readonly rows="18" spellcheck="false" placeholder="The output appears here."></textarea>
    <div class="tools">
      <button id="tool-copy">COPY</button>
      <button data-goto="screen-chambers">BACK</button>
    </div>
  </main>

  <!-- Order matters: main.js uses what the others define. -->
  <script src="src/data.js"></script>
  <script src="src/sim.js"></script>
  <script src="src/history.js"></script>
  <script src="src/input.js"></script>
  <script src="src/render.js"></script>
  <script src="src/chamber-2.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
