<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>varpg</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Entry screen -->
  <main id="screen-menu" class="screen">
    <h1>VARPG</h1>
    <button disabled>NEW GAME</button>
    <button disabled>CONTINUE</button>
    <button data-goto="screen-chambers">TEST CHAMBERS</button>
  </main>

  <!-- Choose the test map -->
  <main id="screen-chambers" class="screen" hidden>
    <h1>TEST CHAMBERS</h1>
    <button data-goto="screen-chamber-1">CHAMBER 1</button>
    <button data-goto="screen-menu">BACK</button>
  </main>

  <!-- Chamber 1: only for testing movement -->
  <main id="screen-chamber-1" class="screen" hidden>
    <h1>CHAMBER 1</h1>
    <canvas id="canvas" width="960" height="540"></canvas>
    <p class="hint">WASD / LEFT STICK: MOVE &middot; MOUSE / RIGHT STICK: AIM</p>
    <button data-goto="screen-chambers">BACK</button>
  </main>

  <!-- Order matters: main.js uses what the others define. -->
  <script src="src/data.js"></script>
  <script src="src/sim.js"></script>
  <script src="src/input.js"></script>
  <script src="src/render.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
